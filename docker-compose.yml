services:
  mysql:
    image: mysql:8.4
    container_name: timetablemanagement_mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: timetablemanagement
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    
    ports:
      - "3306:3306"
    
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

    restart: unless-stopped

volumes:
  mysql_data: